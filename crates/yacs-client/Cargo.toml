[package]
name = "yacs-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2.5.8"
yacs-core = { version = "0.5.0", path = "../yacs-core" }

[dev-dependencies]
tempfile = "3.27.0"
