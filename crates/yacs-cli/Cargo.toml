[package]
name = "yacs-cli"
description = "Command-line client for YACS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6.0.0"
gethostname = "1.1.0"
humantime = "2.4.0"
mime_guess = "2.0.5"
minisign-verify = "0.2.5"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
rpassword = "7.5.4"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
url = "2.5.8"
yacs-client = { version = "0.5.1", path = "../yacs-client" }
yacs-core = { version = "0.5.1", path = "../yacs-core" }

[build-dependencies]
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
clap = "4.6.7"
tokio = { version = "1.53.1", features = ["full"] }
yacs-server = { path = "../yacs-server" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2.189"

[[bin]]
name = "yacs"
path = "src/main.rs"
