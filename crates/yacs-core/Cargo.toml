[package]
name = "yacs-core"
description = "YACS protocol types and end-to-end encryption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.0"
# For the test-vector hooks of `code`, which take the RNG spake2 does.
rand_core = { version = "0.10.1", default-features = false }
# A pre-release, but the one built on the same getrandom 0.4 as the rest.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
thiserror = "2.0.20"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Only for running the test vectors under wasm-bindgen-test-runner, whose
# version must match the wasm-bindgen in Cargo.lock (CI installs it that way).
# Real WASM consumers (yacs-wasm) enable getrandom/wasm_js themselves, as
# getrandom recommends for libraries.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-test = "0.3"
