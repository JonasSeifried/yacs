name: Release

# Push a tag like v1.0.0 (matching the version in tauri.conf.json and
# Cargo.toml). Builds the desktop apps into a draft GitHub release, pushes the
# relay image to ghcr.io, and publishes the release once everything succeeded.
# Until then it stays a draft, so the updater never sees a half-uploaded one.
# Tags with a suffix (v1.1.0-beta.1) become prereleases, which the updater
# skips: it only follows the latest full release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  required: signs updates
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#                                                                   macOS signing + notarization
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#                                                                   Windows signing (Azure Trusted Signing)
# Without the Apple or Azure secrets the apps are built unsigned, which works
# but makes macOS Gatekeeper and Windows SmartScreen warn on first launch.

on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Release-only config
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          # Updater artifacts need the private key, which only CI has, so
          # they're enabled here rather than in tauri.conf.json.
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
            cargo install trusted-signing-cli --locked
            sign="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d YACS %1"
            jq -n --arg sign "$sign" '{bundle: {createUpdaterArtifacts: true, windows: {signCommand: $sign}}}' > apps/desktop/src-tauri/tauri.release.json
          else
            echo '{"bundle": {"createUpdaterArtifacts": true}}' > apps/desktop/src-tauri/tauri.release.json
          fi
          cat apps/desktop/src-tauri/tauri.release.json

      # Only secrets that are set: an empty APPLE_CERTIFICATE would make the
      # build try to sign with it and fail, instead of building unsigned.
      - name: Signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::Put the updater public key into plugins.updater.pubkey in tauri.conf.json."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed."
            exit 1
          fi
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__YACS_EOF__"; echo "$value"; echo "__YACS_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: YACS ${{ github.ref_name }}
          releaseBody: "Desktop apps are attached below. Relay image: ghcr.io/jonasseifried/yacs (this version, and latest)."
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.json

  # Each architecture builds natively on its own runner (arm64 under QEMU took
  # about 30 minutes), pushed untagged by digest; relay-manifest then tags
  # both as one multi-arch image.
  relay-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=relay-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=relay-${{ env.ARCH }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  relay-manifest:
    needs: relay-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  publish:
    needs: [desktop, relay-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
