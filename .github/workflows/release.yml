name: Release

# Push a tag like v1.0.0 (matching the version in tauri.conf.json and
# Cargo.toml). Builds the desktop apps into a draft GitHub release, pushes the
# relay image to ghcr.io, and publishes the release once everything succeeded.
# Until then it stays a draft, so the updater never sees a half-uploaded one.
# Tags with a suffix (v1.1.0-beta.1) become prereleases, which the updater
# skips: it only follows the latest full release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  required: signs updates
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#                                                                   macOS signing + notarization
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#                                                                   Windows signing (Azure Trusted Signing)
# Without the Apple or Azure secrets the apps are built unsigned, which works
# but makes macOS Gatekeeper and Windows SmartScreen warn on first launch.

on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Release-only config
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          # Updater artifacts need the private key, which only CI has, so
          # they're enabled here rather than in tauri.conf.json.
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
            cargo install trusted-signing-cli --locked
            sign="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d YACS %1"
            jq -n --arg sign "$sign" '{bundle: {createUpdaterArtifacts: true, windows: {signCommand: $sign}}}' > apps/desktop/src-tauri/tauri.release.json
          else
            echo '{"bundle": {"createUpdaterArtifacts": true}}' > apps/desktop/src-tauri/tauri.release.json
          fi
          cat apps/desktop/src-tauri/tauri.release.json

      # Only secrets that are set: an empty APPLE_CERTIFICATE would make the
      # build try to sign with it and fail, instead of building unsigned.
      - name: Signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::Put the updater public key into plugins.updater.pubkey in tauri.conf.json."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed."
            exit 1
          fi
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__YACS_EOF__"; echo "$value"; echo "__YACS_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: YACS ${{ github.ref_name }}
          # GitHub lists assets in one flat list, so this sorts them by what you want.
          releaseBody: |
            **Desktop app** (installed apps update themselves)
            - macOS: `YACS_${{ steps.version.outputs.version }}_universal.dmg`
            - Windows: `YACS_${{ steps.version.outputs.version }}_x64-setup.exe` (or the `.msi`)

            **Command line** (`yacs`, for servers and scripts; see the [README](https://github.com/${{ github.repository }}#command-line))
            - Linux: `yacs-cli-linux-x86_64`, `yacs-cli-linux-aarch64`
            - macOS: `yacs-cli-macos` · Windows: `yacs-cli-windows-x86_64.exe`

            **Relay**: `ghcr.io/jonasseifried/yacs:${{ steps.version.outputs.version }}` (and `latest`); update with `docker compose pull && docker compose up -d`.

            The `.tar.gz`, `.sig` and `latest.json` files are for automatic updates.
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.json

  # Each architecture builds natively on its own runner (arm64 under QEMU took
  # about 30 minutes), pushed untagged by digest; relay-manifest then tags
  # both as one multi-arch image.
  relay-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=relay-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=relay-${{ env.ARCH }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  relay-manifest:
    needs: relay-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  # The `yacs` command-line client. Fixed asset names, so
  # releases/latest/download/yacs-cli-linux-$(uname -m) always gets the newest.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: yacs-cli-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: yacs-cli-linux-aarch64
          - runner: macos-latest
            asset: yacs-cli-macos
          - runner: windows-latest
            asset: yacs-cli-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v7
      # Static (musl) on Alpine, like the relay image, so it runs on any Linux.
      - if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1-alpine sh -c \
            'apk add --no-cache musl-dev && cargo build --release --locked -p yacs-cli'
          mkdir dist && cp target/release/yacs "dist/$ASSET"
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p yacs-cli --target "$target"
          done
          mkdir dist
          lipo -create -output "dist/$ASSET" target/{aarch64,x86_64}-apple-darwin/release/yacs
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p yacs-cli
          mkdir dist && cp target/release/yacs.exe "dist/$ASSET"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [desktop, relay-manifest, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: cli
          pattern: cli-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd cli && sha256sum yacs-cli-* > ../sha256.txt && mv ../sha256.txt yacs-cli-sha256.txt)
          gh release upload "$TAG" cli/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
