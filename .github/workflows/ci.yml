name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Core, server, client and CLI. The desktop app needs a GUI toolkit, so it
  # gets its own job on the platforms it ships for.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude yacs-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude yacs-desktop
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - name: Test vectors and the PWA bindings under WASM
        run: |
          cargo test -p yacs-core --target wasm32-unknown-unknown --test vectors
          cargo test -p yacs-wasm --target wasm32-unknown-unknown

  # The PWA imports yacs-wasm, so the UI needs Rust to type-check and build.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yacs/ui wasm
      - run: pnpm ui:check
      - run: pnpm ui:test
      - run: pnpm --filter @yacs/ui build

  # The relay image's WASM and PWA stages, which only the release built
  # before: it copies in just what they need, so a new file the UI build reads
  # breaks the image and not the build above.
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ui
          cache-from: |
            type=gha,scope=ci-relay-ui
            type=gha,scope=relay-amd64
          cache-to: type=gha,mode=max,scope=ci-relay-ui

  desktop:
    strategy:
      fail-fast: false
      matrix:
        # 22.04, like the release: its older glibc runs on more distros.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri's system libraries, plus D-Bus for the keychain migration (Secret Service).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yacs/ui build:desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p yacs-desktop --all-targets -- -D warnings
      - run: cargo test -p yacs-desktop
