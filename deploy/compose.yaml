# YACS relay behind Caddy, which gets and renews the HTTPS certificate.
# The PWA needs HTTPS for the clipboard and for installing.
#
#   cp .env.example .env    # set YACS_DOMAIN and YACS_ACCESS_TOKEN
#   docker compose up -d
#
# Point the domain's DNS at this machine first and open ports 80 and 443.

services:
  yacs:
    # The published image; built from this checkout only if it can't be pulled.
    image: ghcr.io/jonasseifried/yacs:${YACS_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      YACS_ACCESS_TOKEN: ${YACS_ACCESS_TOKEN:?set YACS_ACCESS_TOKEN in deploy/.env}
      YACS_DEFAULT_TTL: ${YACS_DEFAULT_TTL:-15m}
      YACS_MAX_TTL: ${YACS_MAX_TTL:-24h}
      YACS_MAX_SIZE: ${YACS_MAX_SIZE:-20MB}
      YACS_MAX_DISK: ${YACS_MAX_DISK:-2GB}
    volumes:
      - yacs-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [yacs]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YACS_DOMAIN: ${YACS_DOMAIN:?set YACS_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yacs-data:
  caddy-data:
  caddy-config:
