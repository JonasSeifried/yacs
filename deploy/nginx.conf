# nginx site for the relay started by compose.nginx.yaml.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/yacs   # set server_name below
#   sudo ln -s /etc/nginx/sites-available/yacs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d clip.example.com
#
# certbot adds the HTTPS listener and the http → https redirect to this file.
# The phone app needs HTTPS for the clipboard and for installing.
#
# Behind Cloudflare (a proxied, "orange cloud" DNS record):
#
# 1. nginx has to take each client's address from Cloudflare, and only from
#    Cloudflare, or a public relay's limits count Cloudflare (or whatever a
#    visitor claims) instead of the client. In the http block, e.g. in
#    /etc/nginx/conf.d/cloudflare.conf:
#
#      set_real_ip_from 173.245.48.0/20;   # one line per range listed at
#      # …                                 # https://www.cloudflare.com/ips/
#      real_ip_header CF-Connecting-IP;
#
#    Never `set_real_ip_from 0.0.0.0/0`: anyone reaching the server directly
#    could then pick their own address. Check it from outside your network:
#    `curl https://clip.example.com/api/v1/address` should print your own
#    public IP (compare https://ifconfig.me), and the relay's log shouldn't
#    warn about its client addresses.
#
# 2. Refuse visitors who skip Cloudflare and connect to your IP directly:
#    turn on Authenticated Origin Pulls for the zone in Cloudflare (SSL/TLS →
#    Origin Server), save Cloudflare's origin pull CA from
#    https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
#    as /etc/nginx/cloudflare-origin-pull-ca.pem, and uncomment the two
#    ssl_ lines below. Only this site checks it, so other sites on the
#    server are unaffected.

server {
    listen 80;
    listen [::]:80;
    server_name clip.example.com;

    # Request paths contain channel ids, so don't log them.
    access_log off;

    # Only Cloudflare may connect (see 2. above).
    # ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # Keep this above YACS_MAX_SIZE, or large clips are refused here. Big
    # files arrive in 4 MB chunks, so they need at least 5m.
    client_max_body_size 25m;

    location / {
        # The port is YACS_PORT from .env.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client's address, replacing whatever it sent itself: a public
        # relay (YACS_PUBLIC) limits new spaces and requests per address.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Live updates are a long-lived response; the relay sends a keep-alive
        # every 20 s (under nginx's 60 s read timeout) and turns buffering off.
        # Each one holds two of nginx's worker_connections (client and relay),
        # which all sites on this nginx share: raise worker_connections in
        # nginx.conf's events block (e.g. to 4096) on a public relay.
    }
}
