# nginx site for the relay started by compose.nginx.yaml.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/yacs   # set server_name below
#   sudo ln -s /etc/nginx/sites-available/yacs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d clip.example.com
#
# certbot adds the HTTPS listener and the http → https redirect to this file.
# The phone app needs HTTPS for the clipboard and for installing.

server {
    listen 80;
    listen [::]:80;
    server_name clip.example.com;

    # Request paths contain channel ids, so don't log them.
    access_log off;

    # Keep this above YACS_MAX_SIZE, or large clips are refused here. Big
    # files arrive in 4 MB chunks, so they need at least 5m.
    client_max_body_size 25m;

    location / {
        # The port is YACS_PORT from .env.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client's address, replacing whatever it sent itself: a public
        # relay (YACS_PUBLIC) limits new spaces and requests per address.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Live updates are a long-lived response; the relay sends a keep-alive
        # every 20 s (under nginx's 60 s read timeout) and turns buffering off.
    }
}
