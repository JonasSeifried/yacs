[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/JonasSeifried/yacs"

# Big files crawl through unoptimized ChaCha20-Poly1305 (whose generic code
# is compiled into yacs-core); keep tests and dev builds fast.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.yacs-core]
opt-level = 3

# Full debug info is most of target/'s size (gigabytes of object files on
# macOS). Line tables still give file:line in panics and backtraces; switch to
# `debug = true` locally when stepping through code in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
