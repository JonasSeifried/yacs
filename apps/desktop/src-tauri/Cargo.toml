[package]
name = "yacs-desktop"
description = "YACS desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# A lib target keeps the door open for Tauri mobile (v2), which needs one.
[lib]
name = "yacs_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipboard-rs = "0.3.5"
gethostname = "1.1.0"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.20"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
yacs-client = { version = "0.2.0", path = "../../../crates/yacs-client" }
yacs-core = { version = "0.2.0", path = "../../../crates/yacs-core" }

[dev-dependencies]
clap = "4.6.7"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
yacs-server = { path = "../../../crates/yacs-server" }
